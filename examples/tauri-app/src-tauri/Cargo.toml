[package]
name = "tauri-app"
version = "0.1.0"
description = "An app to try the text recognition plugin on a device"
authors = ["Kosmotheka contributors"]
license = "MIT OR Apache-2.0"
publish = false
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", default-features = false, features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-text-recognition = { path = "../../../" }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"

